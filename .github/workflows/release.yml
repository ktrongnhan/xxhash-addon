name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable version to prepare and release (e.g. 2.1.1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run -- preview version changes and build packages without changing GitHub or npm'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  # ─── Stage 1: Prepare release metadata ─────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      ready: ${{ steps.start.outputs.ready }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare and validate version
        id: check
        run: |
          if [ "$GITHUB_REF" != refs/heads/master ]; then
            echo '::error::Start releases from master.'
            exit 1
          fi
          node scripts/prepare-release.js "$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "::error::Tag v$RELEASE_VERSION already exists"
            exit 1
          fi
          node <<'NODE'
          const { name } = require('./package.json');
          (async () => {
            const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${process.env.RELEASE_VERSION}`;
            const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
            if (response.status === 200) throw new Error('This version is already published on npm.');
            if (response.status !== 404) throw new Error(`npm registry check failed: HTTP ${response.status}`);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          git diff --check
          printf '## Release v%s\n\n```diff\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          git diff -- package.json package-lock.json CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit metadata through a release PR and continue from the merged commit
        id: start
        run: bash scripts/start-release.sh

      - name: Upload release metadata
        if: steps.start.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            package.json
            package-lock.json
            CHANGELOG.md
          retention-days: 7

  # ─── Stage 2: Build prebuilt binaries (native runners) ─────────────
  prebuild:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            libc: glibc
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            libc: glibc
          - runner: macos-latest
            platform: darwin
            arch: arm64
            macos_target: '11.0'
            libc: ''
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            macos_target: '10.15'
            libc: ''
          - runner: windows-latest
            platform: win32
            arch: x64
            libc: ''
          - runner: windows-11-arm
            platform: win32
            arch: arm64
            libc: ''

    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: release-metadata

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build addon
        run: npm ci
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target || '' }}

      - name: Run tests
        run: npm test

      - name: Audit glibc symbols (Linux)
        if: matrix.platform == 'linux'
        run: |
          echo "=== Required GLIBC versions ==="
          objdump -T build/Release/addon.node | grep GLIBC | sed 's/.*GLIBC_/GLIBC_/' | sort -uV
          echo ""
          echo "If you see GLIBC versions above 2.28, investigate -- Node.js 18+ requires glibc 2.28."

      - name: Prepare prebuild
        shell: bash
        run: |
          DIR="prebuilds/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$DIR"
          SUFFIX="${{ matrix.libc != '' && format('.{0}', matrix.libc) || '' }}"
          cp build/Release/addon.node "${DIR}/addon.napi${SUFFIX}.node"
          echo "Prebuild: ${DIR}/addon.napi${SUFFIX}.node"
          ls -lh "${DIR}/"

      - name: Strip binary (Linux)
        if: matrix.platform == 'linux'
        run: strip "prebuilds/${{ matrix.platform }}-${{ matrix.arch }}"/*.node

      - name: Strip binary (macOS)
        if: matrix.platform == 'darwin'
        run: strip -x "prebuilds/${{ matrix.platform }}-${{ matrix.arch }}"/*.node

      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilds/
          retention-days: 7

  # ─── Stage 3: Build musl prebuilds (Alpine containers) ─────────────
  prebuild-musl:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64

    name: Build linux-${{ matrix.arch }} musl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: release-metadata

      - name: Build and test in Alpine container
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work node:24-alpine sh -c "
            apk add --no-cache python3 make g++ &&
            npm ci &&
            npm test &&
            mkdir -p prebuilds/linux-${{ matrix.arch }} &&
            cp build/Release/addon.node prebuilds/linux-${{ matrix.arch }}/addon.napi.musl.node &&
            strip prebuilds/linux-${{ matrix.arch }}/addon.napi.musl.node &&
            ls -lh prebuilds/linux-${{ matrix.arch }}/
          "

      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux-${{ matrix.arch }}-musl
          path: prebuilds/
          retention-days: 7

  # ─── Stage 4: Verify prebuilds on each platform ────────────────────
  verify:
    needs: [prebuild, prebuild-musl]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: win32-x64
          - runner: windows-11-arm
            platform: win32-arm64

    name: Verify ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: release-metadata

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install node-gyp-build (runtime dep only, no native build)
        run: npm ci --ignore-scripts

      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: prebuilds
          pattern: prebuild-*
          merge-multiple: true

      - name: List prebuilds
        shell: bash
        run: find prebuilds -type f -exec ls -lh {} \;

      - name: Verify prebuild loads (no compiled build)
        shell: bash
        run: |
          # Remove any compiled build to force prebuild usage
          rm -rf build
          node -e "
            var m = require('./xxhash-addon');
            var classes = Object.keys(m);
            console.log('Loaded classes:', classes.join(', '));
            if (classes.length !== 4) throw new Error('Expected 4 classes, got ' + classes.length);
          "

      - name: Run full test suite with prebuilds
        run: node xxhash-addon.test.js

  # ─── Stage 5: Publish ──────────────────────────────────────────────
  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: release-metadata

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies (no native build)
        run: npm ci --ignore-scripts

      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: prebuilds
          pattern: prebuild-*
          merge-multiple: true

      - name: List prebuilds
        run: find prebuilds -type f -exec ls -lh {} \;

      - name: Create and inspect tarball
        run: |
          npm pack
          echo "=== Package contents ==="
          tar tzf xxhash-addon-*.tgz
          echo ""
          echo "=== Package size ==="
          ls -lh xxhash-addon-*.tgz

      - name: Dry run summary
        if: inputs.dry_run
        run: |
          echo "::notice::DRY RUN -- skipping npm publish and git tag"
          echo ""
          echo "Would publish xxhash-addon@$RELEASE_VERSION"
          echo "Would create tag v$RELEASE_VERSION"
          echo "Would create GitHub Release v$RELEASE_VERSION"
          echo ""
          echo "Re-run this workflow with dry_run=false to publish for real."

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: |
          git diff --exit-code -- package.json package-lock.json CHANGELOG.md
          npm publish "xxhash-addon-$RELEASE_VERSION.tgz" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
          const section = text.split(`## v${process.env.RELEASE_VERSION}\n`)[1].split(/^## /m)[0];
          fs.writeFileSync(process.env.RUNNER_TEMP + '/release-notes.md', section.trim() + '\n');
          NODE
          gh release create "v$RELEASE_VERSION" \
            --title "v$RELEASE_VERSION" --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Verify published package and provenance
        if: ${{ !inputs.dry_run }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { name, version } = require('./package.json');
          const tarball = fs.readFileSync(`${name}-${version}.tgz`);
          const integrity = 'sha512-' + crypto.createHash('sha512').update(tarball).digest('base64');
          (async () => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`, { signal: AbortSignal.timeout(30000) });
            assert.equal(response.status, 200, 'Published version must be readable from npm');
            const published = await response.json();
            assert.equal(published.dist.integrity, integrity, 'npm tarball must match the inspected package');
            assert.equal(published.dist.attestations?.provenance?.predicateType, 'https://slsa.dev/provenance/v1', 'npm provenance must be present');
            console.log(`Verified ${name}@${version}: tarball integrity and provenance.`);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
